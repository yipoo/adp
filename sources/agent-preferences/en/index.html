<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent preferences panel</title><style>
body{margin:0;background:var(--bg,#f4f5f8);color:#242b3b;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
*{box-sizing:border-box}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #e0e5ef;border-radius:9px;padding:8px 12px;background:#fff;transition:background .18s,transform .16s}button:hover{background:#f0f3ff}button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #4058f4;outline-offset:3px}input[type=search],select{width:100%;border:1px solid #dce2ed;border-radius:10px;background:#fff;padding:11px 12px}input[type=checkbox],input[type=range]{accent-color:#4058f4}h2,h3,p{margin:0}.ac-panel{width:100%;max-width:470px;min-width:0;background:#fff;border:1px solid #e1e5ef;border-radius:18px;padding:24px;box-shadow:0 14px 45px #23324b09}.ac-panel.ac-wide{max-width:740px}.ac-kicker{color:#69768b;font:10px/1.4 ui-monospace,monospace;letter-spacing:1.8px;margin-bottom:10px}.ac-panel h2{font-size:23px;font-weight:600;letter-spacing:-.65px;line-height:1.35}.ac-sub{font-size:13px;color:#6f7a8e;margin:9px 0 22px}.ac-list{display:grid;gap:8px;margin:14px 0}.ac-option{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #e5e9f1;border-radius:10px;cursor:pointer;transition:background .18s,border-color .18s}.ac-option:has(:checked){background:#f0f3ff;border-color:#9faff8}.ac-option input{width:17px;height:17px;flex:none}.ac-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}.ac-primary{background:#4058f4;color:white;border-color:#4058f4}.ac-primary:hover{background:#344bdd}.ac-meta{font-size:12px;color:#738096}.ac-result{min-height:20px;font-size:13px;color:#3854be;margin-top:15px;overflow-wrap:anywhere}.ac-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.ac-tag{padding:4px 8px;border-radius:7px;background:#eef2ff;color:#4254a8;font-size:12px}.ac-empty{font-size:13px;color:#788295;padding:18px 0}.ac-command{width:100%;text-align:left;padding:12px;display:flex;align-items:center;gap:12px}.ac-command[aria-selected=true]{background:#edf2ff;border-color:#91a3f7;color:#314ac0}.ac-command small{margin-left:auto;color:#8c98ab}.ac-toast{display:flex;gap:12px;align-items:center;border:1px solid #dfe6f0;border-radius:12px;background:#f9fbff;padding:13px;animation:ac-enter .22s ease-out}.ac-toast span{flex:1;min-width:0;font-size:13px;overflow-wrap:anywhere}.ac-toast b{display:block;color:#4058f4;font-size:10px}.ac-toast button{padding:4px 8px;flex:none}.ac-filter-row{display:grid;grid-template-columns:1fr 150px auto;gap:8px;margin-bottom:14px}.ac-table-wrap{overflow:auto}.ac-table{border-collapse:collapse;width:100%;font-size:13px}.ac-table th{text-align:left;font-size:11px;font-weight:500;color:#6e7a8e;border-bottom:1px solid #dfe5ee;padding:0 0 10px}.ac-table th button{padding:5px 0;border:0;background:transparent;text-align:left}.ac-table td{padding:16px 8px 16px 0;border-bottom:1px solid #edf0f5}.ac-status{font-size:11px;border-radius:20px;padding:4px 8px;background:#f0f3f9;color:#647185;white-space:nowrap}.ac-status[data-state=done]{background:#eaf6ef;color:#32765b}.ac-status[data-state=running]{background:#edf1ff;color:#4058c4}.ac-status[data-state=failed]{background:#fff0eb;color:#a95135}.ac-run{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid #e9edf4}.ac-run strong{font-size:14px;font-weight:550}.ac-run small{display:block;font-size:12px;color:#7b879b;margin-top:4px}.ac-dialog{position:fixed;inset:0 0 0 auto;margin:0;width:min(440px,100%);height:100%;max-height:100%;max-width:100%;border:0;border-left:1px solid #dce3ef;background:white;padding:28px;color:#263247;box-shadow:-20px 0 80px #15284922;animation:ac-slide .25s ease-out}.ac-dialog::backdrop{background:#15223d55}.ac-dialog header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.ac-dialog h3{font-size:23px;line-height:1.4;letter-spacing:-.5px}.ac-tabs{display:flex;gap:8px;margin:24px 0 20px;border-bottom:1px solid #e8edf5;padding-bottom:10px}.ac-tabs button[aria-selected=true]{background:#edf1ff;color:#4058c4;border-color:#b8c5ff}.ac-dialog dl{margin:0;display:grid;gap:18px}.ac-dialog dt{font-size:12px;color:#7a8598}.ac-dialog dd{margin:3px 0 0;font-size:14px;overflow-wrap:anywhere}.ac-setting{display:grid;gap:9px;padding:15px 0;border-bottom:1px solid #edf0f6}.ac-toggle{display:flex;align-items:center;justify-content:space-between;gap:18px;cursor:pointer}.ac-toggle input{width:20px;height:20px;flex:none}.ac-setting input[type=range]{width:100%;margin:8px 0}.ac-error{color:#ae493e}.ac-panel [hidden],.ac-dialog [hidden]{display:none!important}@keyframes ac-enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes ac-slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}@media(max-width:520px){body{padding:16px}.ac-panel{padding:20px}.ac-panel h2{font-size:21px}.ac-filter-row{grid-template-columns:1fr auto}.ac-filter-row input{grid-column:1/-1}.ac-table td{padding:13px 6px 13px 0}.ac-dialog{padding:22px}.ac-run{align-items:flex-start}.ac-run button{white-space:nowrap}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}body{--bg:#f1f3f8}</style></head><body><section class="ac-panel" aria-label="Agent preferences"><div class="ac-kicker">AGENT / PREFERENCES</div><h2>Agent preferences</h2><p class="ac-sub">Set the defaults for your next task.</p><form><label class="ac-setting"><span>Reasoning mode</span><select name="mode"><option value="0">Balanced</option><option value="1">Thorough</option></select></label><label class="ac-setting"><span>Context budget <output data-ac-budget>64K</output></span><input type="range" name="budget" min="16" max="128" step="16" value="64"></label><label class="ac-setting ac-toggle"><span>Ask before external actions</span><input type="checkbox" name="approval" checked></label><label class="ac-setting ac-toggle"><span>Show source citations</span><input type="checkbox" name="citations" checked></label><div class="ac-actions"><button type="submit" class="ac-primary">Save preferences</button><button type="reset">Reset</button></div></form><p class="ac-result" data-ac-live role="status" aria-live="polite"></p></section><script>const panel=document.querySelector('.ac-panel');const $=s=>panel.querySelector(s);const $$=s=>[...panel.querySelectorAll(s)];const c={"title":["Source scope","Find the next action","Run notifications","Execution records","Task inspector","Agent preferences"],"sub":["Choose the sources available to this task.","Search actions and use ↑ ↓, Enter to select.","Keep track of changes without losing your place.","Find a run, filter its state, and inspect the results.","Open the task context while keeping the list in view.","Set the defaults for your next task."],"applied":"Applied sources","sources":["Project brief","Research notes","Design guidelines","Release checklist"],"search":"Search","clear":"Clear","apply":"Apply selection","selected":"Selected","empty":"No matches. Try another search.","done":"Done","running":"Running","failed":"Failed","all":"All states","name":"Task","status":"State","duration":"Duration","count":"results","open":"Inspect task","close":"Close","details":"Details","context":"Context","task":"Prepare release brief","notify":"Add notification","dismiss":"Dismiss","undo":"Undo","message":"Release brief is ready to review.","removed":"Notification dismissed.","restored":"Notification restored.","activity":"Activity","actions":["Start a research task","Review pending approvals","Search the knowledge base","Open execution records"],"actionResult":"Selected action","scope":"Source scope","state":"Task state","notes":"Research notes · Project brief","activityText":"Sources selected → draft prepared → ready for review","model":"Reasoning mode","modes":["Balanced","Thorough"],"budget":"Context budget","approval":"Ask before external actions","citations":"Show source citations","save":"Save preferences","reset":"Reset","saved":"Preferences saved for this session.","invalid":"Choose at least one source.","footer":"","created":"Started","recent":"Today · 09:40","result":"Ready for review","pending":"Awaiting review"};const form=$('form'),budget=$('[name=budget]');budget.oninput=()=>$('[data-ac-budget]').textContent=budget.value+'K';form.onsubmit=e=>{e.preventDefault();const settings={mode:Number($('[name=mode]').value),budget:Number(budget.value),approval:$('[name=approval]').checked,citations:$('[name=citations]').checked};panel.dataset.preferences=JSON.stringify(settings);panel.dispatchEvent(new CustomEvent('adp-preferences',{bubbles:true,detail:settings}));$('[data-ac-live]').textContent=c.saved;};form.onreset=()=>{setTimeout(()=>{budget.oninput();$('[data-ac-live]').textContent='';delete panel.dataset.preferences;panel.dispatchEvent(new CustomEvent('adp-preferences-reset',{bubbles:true}))},0)};</script></body></html>
