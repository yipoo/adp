<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADP Pro — Lifetime & account</title><link rel="icon" href="./assets/brand/adp-icon.svg"><link rel="stylesheet" href="./src/style.css"><link rel="stylesheet" href="./src/account.css"></head><body><header class="header"><a href="./index.html" class="brand"><img class="brand-icon" src="./assets/brand/adp-icon.svg" width="32" height="32" alt="">ADP<span class="beta">PRO</span></a><a href="./index.html#library" data-i18n="library"></a><button id="language" class="language-btn">EN / 中</button></header><main class="account-main"><section class="membership-hero"><span class="eyebrow">INVEST IN YOUR NEXT INTERFACE</span><h1 data-i18n="headline"></h1><p data-i18n="intro"></p><div id="environment" class="environment" role="status"></div></section><section id="products" class="membership-grid lifetime-grid" aria-label="Lifetime access"></section><p class="membership-note" data-i18n="openSource"></p><div id="comparison"></div><section class="account-panel"><div class="account-intro"><span class="eyebrow">YOUR WORKSPACE</span><h2 data-i18n="account"></h2><p data-i18n="accountIntro"></p><span id="identity"></span></div><div class="account-controls"><form id="email-form"><label for="email" data-i18n="email"></label><div class="input-row"><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><button id="send-code" class="primary small-btn" data-i18n="sendCode"></button></div></form><form id="code-form" hidden><label for="code" data-i18n="code"></label><div class="input-row"><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" required><button id="verify" class="primary small-btn" data-i18n="verify"></button></div></form><div id="signed-in" hidden><p id="entitlements"></p><div class="account-actions"><button id="portal" class="primary small-btn" data-i18n="portal"></button><button i
