name: Check bilingual catalog and framework source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix billing
      - run: npm run check
      - run: npm run test:billing
      - run: npm run build:vercel
      - run: node tools/verify-static.mjs
