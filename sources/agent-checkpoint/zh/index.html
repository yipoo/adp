utton data-tl-snapshot="1" aria-pressed="true"><span class="tl-mono">02 · </span>完成摘要之后</button></div><div class="tl-detail" data-tl-snapshot-preview>完成摘要之后 · brief.md: 已完成</div><div class="tl-actions"><button class="tl-primary" data-tl-restore>恢复预览</button></div><div class="tl-confirm" data-tl-confirm hidden><strong>恢复到这个检查点？</strong><p>只改变当前演示中的选中状态。</p><div class="tl-actions"><button class="tl-primary" data-tl-confirm-yes>恢复预览</button><button data-tl-cancel>取消</button></div></div><p class="tl-live" role="status" data-tl-status></p><p class="tl-foot">仅演示事件 · 可接入自己的运行服务</p></section><script>{const c={"local":"本地演示","done":"已完成","running":"执行中","pending":"待执行","failed":"失败","paused":"已暂停","reset":"重置","next":"推进一步","details":"详情","steps":["读取任务需求","检索项目资料","对比来源证据","整理最终简报"],"title":"从请求到结果，每一步都清楚。","subtitle":"研究任务 · 4 个可观察步骤","footer":"仅演示事件 · 可接入自己的运行服务","tool":"工具调用","input":"输入参数","output":"输出结果","execute":"演示运行","toolNote":"只读检索 · 项目：Atlas","toolResult":"找到 3 份匹配资料，没有修改文件。","plan":"一个能跟得上的计划。","planNote":"产品简报 · 按顺序执行","advance":"完成下一项","tasks":["收集来源资料","对比关键发现","撰写最终摘要"],"approveTitle":"继续之前，先确认范围。","approveNote":"Agent 请求更新草稿的权限。","approve":"演示批准","deny":"拒绝","approvalPending":"等待你的决定","approved":"已在本地批准 · 草稿未修改","denied":"已拒绝 · 草稿未修改","scope":"操作范围","scopeValue":"仅更新 brief.md 中的摘要","sources":"答案有依据，也能追溯。","sourcesNote":"简报参考了两份项目资料。","sourceHint":"点击引用编号，查看对应来源。","sourcePreview":"来源预览","sourceTitles":["执行检查清单","工具结果说明"],"sourceFiles":["execution-checklist.md","tool-results.md"],"readSource":"阅读资料","sourceFull":["记录任务请求、步骤顺序、状态变化与最终结果。保留已完成的操作，并清楚呈现错误状态。","将工具输入、执行状态、结果与审批决定分开呈现。对外写入前确认，检索失败时保留之前的结果。"],"sourceSummary":["执行检查清单记录可观察的任务步骤及其状态。","工具结果说明区分输入、状态、结果与审批。"],"children":"拆成子任务，保持全局清楚。","childrenNote":"协调者 · 2 个并行任务","inspect":"查看","childNames":["资料研究助手","质量审阅助手"],"childTasks":["查找相关的交互模式","检查状态和可访问性覆盖"],"childResults":["已找到时间线、工具调用与检查点模式。","已检查键盘焦点与明确的状态标签。"],"failure":"失败一步，保留完整上下文。","failureNote":"search_documents · 尝试次数 ","error":"演示超时，只读检索没有返回结果。","retry":"演示重试检索","skip":"跳过此步","skipped":"已跳过 · 未添加证据","retrying":"正在重试检索…","recovered":"重试成功 · 找到 3 份资料","checkpoint":"回到一个明确的节点。","checkpointNote":"本地预览状态 · 不影响项目文件","snapshots":["收集资料之后","完成摘要之后"],"restore":"恢复预览","confirm":"恢复到这个检查点？","restoreNote":"只改变当前演示中的选中状态。","cancel":"取消","restored":"预览已恢复到：","context":"知道这次任务用了多少上下文。","contextNote":"上下文预算 · 示例估算","compact":"演示压缩","contextBefore":"48,000 / 128,000 tokens · 37.5%","contextAfter":"24,000 / 128,000 tokens · 18.75%","contextParts":["指令","资料","对话"],"compacted":"预览已压缩 · 真实上下文未改变","cost":"预估任务费用 · $0.014","waterfall":"时间花在哪里，一眼可见。","waterfallNote":"研究任务 · 固定示例轨迹","all":"全部步骤","tools":"仅工具","span":"选中步骤","duration":"耗时","toolCount":"2 次工具调用","selected":"已选中","checked":"完成"};const one=s=>document.querySelector(s);const all=s=>[...document.querySelectorAll(s)];let selected=1;const panel=one('[data-tl-confirm]'),trigger=one('[data-tl-restore]');function close(){panel.hidden=true;trigger.disabled=false;all('[data-tl-snapshot]').forEach(b=>b.disabled=false);trigger.focus()}all('[data-tl-snapshot]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.tlSnapshot);all('[data-tl-snapshot]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));one('[data-tl-status]').textContent=''});trigger.onclick=()=>{panel.hidden=false;trigger.disabled=true;all('[data-tl-snapshot]').forEach(b=>b.disabled=true);one('[data-tl-confirm-yes]').focus()};one('[data-tl-cancel]').onclick=close;one('[data-tl-confirm-yes]').onclick=()=>{one('[data-tl-snapshot-preview]').textContent=c.snapshots[selected]+' · brief.md: '+(selected===0?c.pending:c.done);one('[data-tl-status]').textContent=c.restored+c.snapshots[selected];close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)close()});}</script></body></html>
