<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task inspector drawer</title><style>
body{margin:0;background:var(--bg,#f4f5f8);color:#242b3b;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
*{box-sizing:border-box}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #e0e5ef;border-radius:9px;padding:8px 12px;background:#fff;transition:background .18s,transform .16s}button:hover{background:#f0f3ff}button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #4058f4;outline-offset:3px}input[type=search],select{width:100%;border:1px solid #dce2ed;border-radius:10px;background:#fff;padding:11px 12px}input[type=checkbox],input[type=range]{accent-color:#4058f4}h2,h3,p{margin:0}.ac-panel{width:100%;max-width:470px;min-width:0;background:#fff;border:1px solid #e1e5ef;border-radius:18px;padding:24px;box-shadow:0 14px 45px #23324b09}.ac-panel.ac-wide{max-width:740px}.ac-kicker{color:#69768b;font:10px/1.4 ui-monospace,monospace;letter-spacing:1.8px;margin-bottom:10px}.ac-panel h2{font-size:23px;font-weight:600;letter-spacing:-.65px;line-height:1.35}.ac-sub{font-size:13px;color:#6f7a8e;margin:9px 0 22px}.ac-list{display:grid;gap:8px;margin:14px 0}.ac-option{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #e5e9f1;border-radius:10px;cursor:pointer;transition:background .18s,border-color .18s}.ac-option:has(:checked){background:#f0f3ff;border-color:#9faff8}.ac-option input{width:17px;height:17px;flex:none}.ac-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}.ac-primary{background:#4058f4;color:white;border-color:#4058f4}.ac-primary:hover{background:#344bdd}.ac-meta{font-size:12px;color:#738096}.ac-result{min-height:20px;font-size:13px;color:#3854be;margin-top:15px;overflow-wrap:anywhere}.ac-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.ac-tag{padding:4px 8px;border-radius:7px;background:#eef2ff;color:#4254a8;font-size:12px}.ac-empty{font-size:13px;color:#788295;padding:18px 0}.ac-command{width:100%;text-align:left;padding:12px;display:flex;align-items:center;gap:12px}.ac-command[aria-selected=true]{background:#edf2ff;border-color:#91a3f7;color:#314ac0}.ac-command small{margin-left:auto;color:#8c98ab}.ac-toast{display:flex;gap:12px;align-items:center;border:1px solid #dfe6f0;border-radius:12px;background:#f9fbff;padding:13px;animation:ac-enter .22s ease-out}.ac-toast span{flex:1;min-width:0;font-size:13px;overflow-wrap:anywhere}.ac-toast b{display:block;color:#4058f4;font-size:10px}.ac-toast button{padding:4px 8px;flex:none}.ac-filter-row{display:grid;grid-template-columns:1fr 150px auto;gap:8px;margin-bottom:14px}.ac-table-wrap{overflow:auto}.ac-table{border-collapse:collapse;width:100%;font-size:13px}.ac-table th{text-align:left;font-size:11px;font-weight:500;color:#6e7a8e;border-bottom:1px solid #dfe5ee;padding:0 0 10px}.ac-table th button{padding:5px 0;border:0;background:transparent;text-align:left}.ac-table td{padding:16px 8px 16px 0;border-bottom:1px solid #edf0f5}.ac-status{font-size:11px;border-radius:20px;padding:4px 8px;background:#f0f3f9;color:#647185;white-space:nowrap}.ac-status[data-state=done]{background:#eaf6ef;color:#32765b}.ac-status[data-state=running]{background:#edf1ff;color:#4058c4}.ac-status[data-state=failed]{background:#fff0eb;color:#a95135}.ac-run{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid #e9edf4}.ac-run strong{font-size:14px;font-weight:550}.ac-run small{display:block;font-size:12px;color:#7b879b;margin-top:4px}.ac-dialog{position:fixed;inset:0 0 0 auto;margin:0;width:min(440px,100%);height:100%;max-height:100%;max-width:100%;border:0;border-left:1px solid #dce3ef;background:white;padding:28px;color:#263247;box-shadow:-20px 0 80px #15284922;animation:ac-slide .25s ease-out}.ac-dialog::backdrop{background:#15223d55}.ac-dialog header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.ac-dialog h3{font-size:23px;line-height:1.4;letter-spacing:-.5px}.ac-tabs{display:flex;gap:8px;margin:24px 0 20px;border-bottom:1px solid #e8edf5;padding-bottom:10px}.ac-tabs button[aria-selected=true]{background:#edf1ff;color:#4058c4;border-color:#b8c5ff}.ac-dialog dl{margin:0;display:grid;gap:18px}.ac-dialog dt{font-size:12px;color:#7a8598}.ac-dialog dd{margin:3px 0 0;font-size:14px;overflow-wrap:anywhere}.ac-setting{display:grid;gap:9px;padding:15px 0;border-bottom:1px solid #edf0f6}.ac-toggle{display:flex;align-items:center;justify-content:space-between;gap:18px;cursor:pointer}.ac-toggle input{width:20px;height:20px;flex:none}.ac-setting input[type=range]{width:100%;margin:8px 0}.ac-error{color:#ae493e}.ac-panel [hidden],.ac-dialog [hidden]{display:none!important}@keyframes ac-enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes ac-slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}@media(max-width:520px){body{padding:16px}.ac-panel{padding:20px}.ac-panel h2{font-size:21px}.ac-filter-row{grid-template-columns:1fr auto}.ac-filter-row input{grid-column:1/-1}.ac-table td{padding:13px 6px 13px 0}.ac-dialog{padding:22px}.ac-run{align-items:flex-start}.ac-run button{white-space:nowrap}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}body{--bg:#f1f3f8}</style></head><body><section class="ac-panel" aria-label="任务详情抽屉"><div class="ac-kicker">AGENT / INSPECTOR</div><h2>任务详情抽屉</h2><p class="ac-sub">保留任务列表，同时查看任务上下文。</p><div class="ac-run"><div><strong>准备发布简报</strong><small>今天 · 09:40</small></div><button type="button" class="ac-primary" data-ac-open>查看任务 ↗</button></div><p class="ac-meta" style="margin-top:16px">待审阅</p><dialog class="ac-dialog" aria-labelledby="ac-dialog-title"><header><span class="ac-kicker">TASK / 024</span><button type="button" data-ac-close autofocus>关闭 ×</button></header><h3 id="ac-dialog-title">准备发布简报</h3><div class="ac-tabs" role="tablist" aria-label="任务详情"><button type="button" role="tab" id="ac-tab-details" aria-controls="ac-page-details" aria-selected="true" data-ac-tab="details">任务详情</button><button type="button" role="tab" id="ac-tab-context" aria-controls="ac-page-context" aria-selected="false" tabindex="-1" data-ac-tab="context">上下文</button></div><div role="tabpanel" id="ac-page-details" aria-labelledby="ac-tab-details" tabindex="0"><dl><div><dt>任务状态</dt><dd>等待审阅</dd></div><div><dt>开始时间</dt><dd>今天 · 09:40</dd></div><div><dt>活动记录</dt><dd>选择资料 → 准备草稿 → 等待审阅</dd></div></dl></div><div role="tabpanel" id="ac-page-context" aria-labelledby="ac-tab-context" tabindex="0" hidden><dl><div><dt>资料范围</dt><dd>研究笔记 · 项目简报</dd></div><div><dt>推理模式</dt><dd>均衡</dd></div></dl></div></dialog></section><script>const panel=document.querySelector('.ac-panel');const $=s=>panel.querySelector(s);const $$=s=>[...panel.querySelectorAll(s)];const c={"title":["资料范围","找到下一步操作","任务通知队列","执行记录","任务详情抽屉","Agent 偏好设置"],"sub":["选择本次任务可以使用的资料。","搜索操作，使用 ↑ ↓ 和 Enter 选择。","及时了解变化，保持当前工作节奏。","查找任务，筛选状态，检查执行结果。","保留任务列表，同时查看任务上下文。","为下一次任务设置默认偏好。"],"applied":"已应用资料","sources":["项目简报","研究笔记","设计规范","发布清单"],"search":"搜索","clear":"清空","apply":"应用选择","selected":"已选","empty":"没有匹配结果，请换个关键词。","done":"已完成","running":"执行中","failed":"失败","all":"全部状态","name":"任务","status":"状态","duration":"耗时","count":"项结果","open":"查看任务","close":"关闭","details":"任务详情","context":"上下文","task":"准备发布简报","notify":"添加通知","dismiss":"关闭通知","undo":"撤销","message":"发布简报已准备好，等待审阅。","removed":"已关闭通知。","restored":"已恢复通知。","activity":"活动记录","actions":["开始研究任务","审阅待审批操作","搜索知识库","打开执行记录"],"actionResult":"已选操作","scope":"资料范围","state":"任务状态","notes":"研究笔记 · 项目简报","activityText":"选择资料 → 准备草稿 → 等待审阅","model":"推理模式","modes":["均衡","深入"],"budget":"上下文预算","approval":"对外操作前询问","citations":"显示来源引用","save":"保存偏好","reset":"重置","saved":"已保存本次会话的偏好。","invalid":"请至少选择一项资料。","footer":"","created":"开始时间","recent":"今天 · 09:40","result":"等待审阅","pending":"待审阅"};const dialog=$('dialog'),trigger=$('[data-ac-open]');trigger.onclick=()=>dialog.showModal();$('[data-ac-close]').onclick=()=>dialog.close();dialog.onclose=()=>trigger.focus();dialog.onclick=e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}};const tabs=$$('[data-ac-tab]');function tab(b){tabs.forEach(t=>{const active=t===b;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;$('#ac-page-'+t.dataset.acTab).hidden=!active})}tabs.forEach((b,n)=>{b.onclick=()=>tab(b);b.onkeydown=e=>{let target;if(e.key==='ArrowRight'||e.key==='ArrowLeft')target=tabs[(n+1)%2];if(e.key==='Home')target=tabs[0];if(e.key==='End')target=tabs[1];if(target){e.preventDefault();tab(target);target.focus()}}});</script></body></html>
